/**
 * HTML 이스케이프
 * @param {string} s 원문
 * @returns {string} 이스케이프된 문자열
 */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/**
 * 카카오맵 링크 생성. 좌표가 확정된 곳은 길찾기, 추정 좌표는 이름 검색으로 연결
 * @param {string} key 장소 키
 * @returns {string} URL (링크 없는 장소는 빈 문자열)
 */
function kakaoUrl(key) {
  var s = stops[key];
  if (s.noLink) return '';
  if (s.approx) return 'https://map.kakao.com/link/search/' + encodeURIComponent(s.query || s.name);
  return 'https://map.kakao.com/link/to/' + encodeURIComponent(s.name) + ',' + s.lat + ',' + s.lng;
}

/**
 * 일정을 방문 순서(연속된 같은 장소는 한 번 방문)로 묶고 번호를 부여
 * @param {number} day 일차
 * @returns {{visits: Array, stopLabels: Object}} 방문 목록과 장소별 번호 라벨
 */
function buildVisits(day) {
  var visits = [], stopLabels = {};
  days[day].items.forEach(function (it, idx) {
    var last = visits[visits.length - 1];
    if (last && last.stop === it.stop) { last.items.push(idx); it.visit = last.no; return; }
    var v = { no: visits.length + 1, stop: it.stop, items: [idx] };
    visits.push(v);
    it.visit = v.no;
    (stopLabels[it.stop] = stopLabels[it.stop] || []).push(v.no);
  });
  return { visits: visits, stopLabels: stopLabels };
}

var map = L.map('map', { zoomControl: true }).setView([36.52, 127.79], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

}).addTo(map);
var layer = L.layerGroup().addTo(map);
var showingAll = false;
var FitControl = L.Control.extend({
  options: { position: 'topright' },
  /** 현지/전체 경로 전환 버튼 생성 */

    L.DomEvent.on(btn, 'click', function () {
      showingAll = !showingAll;
      btn.textContent = showingAll ? '현지 확대' : '전체 경로 보기';
      map.fitBounds(showingAll ? allBounds : localBounds, { padding: [30, 30] });
    });
    this.btn = btn;
    return btn;
  }
});
var fitControl = new FitControl().addTo(map);
var markers = {};
var currentDay = 1;
var activeStop = null;
var visitInfo = null;
var localBounds = null;
var allBounds = null;

/**
 * 선택한 장소의 마커를 강조하고 타임라인 항목을 표시
 * @param {string} key 장소 키
 * @param {number} itemIdx 클릭한 항목 인덱스(없으면 장소의 첫 항목)
 */
function selectStop(key, itemIdx) {
  activeStop = key;
  Object.keys(markers).forEach(function (k) {
    var el = markers[k].getElement();
    if (el) el.firstChild.classList.toggle('active', k === key);
    markers[k].setZIndexOffset(k === key ? 1000 : 0);
  });
  document.querySelectorAll('.item').forEach(function (b) {
    b.classList.toggle('active', Number(b.dataset.idx) === itemIdx);
  });
}

/**
 * 해당 일차의 마커·경로를 지도에 그림
 * @param {number} day 일차
 */
function drawMap(day) {
  layer.clearLayers();
  markers = {};
  var info = visitInfo, hex = days[day].hex, bounds = [], local = [];
  var legs = routes['d' + day].slice();
  if (day === 1) legs.push(routes.extra[0]);

  legs.forEach(function (leg, i) {
    var isExtra = day === 1 && i === legs.length - 1;
    var walk = leg.mode === 'walk';
    if (!walk) L.polyline(leg.coords, { color: '#fff', weight: 8, opacity: .9 }).addTo(layer);
    var line = L.polyline(leg.coords, walk
      ? { color: hex, weight: 5, opacity: isExtra ? .55 : 1, dashArray: '1 9', lineCap: 'round' }
      : { color: hex, weight: 5, opacity: .95 }).addTo(layer);
    if (isExtra) line.bindTooltip('세조길 (세심정 방향)', { sticky: true });
    leg.coords.forEach(function (c) { bounds.push(c); });
    if (leg.from !== 'bucheon' && leg.to !== 'bucheon') leg.coords.forEach(function (c) { local.push(c); });
  });

  Object.keys(info.stopLabels).forEach(function (key) {
    var s = stops[key], label = info.stopLabels[key].join('·');
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin' + (label.length > 1 ? ' wide' : '') + (s.approx ? ' approx' : '') + '" style="--c:' + hex + '">' + label + '</div>',
      iconSize: null, iconAnchor: [15, 15], popupAnchor: [0, -16]
    });
    var m = L.marker([s.lat, s.lng], { icon: icon, title: s.name }).addTo(layer);
    var body = '<div class="pop"><h3>' + label + '. ' + esc(s.name) + '</h3>';
    days[day].items.forEach(function (it) {
      if (it.stop !== key) return;
      body += '<div class="t">' + esc(it.time) + ' · ' + esc(it.title) + '</div>';
      if (it.memo) body += '<p>' + esc(it.memo) + '</p>';
      if (it.check) body += '<p class="w">전화 확인 필요</p>';
    });
    if (s.approx && !s.noLink) body += '<p class="w">좌표 추정 — 카카오맵에서 이름으로 검색</p>';
    var url = kakaoUrl(key);
    if (url) body += '<p><a href="' + url + '" target="_blank" rel="noopener">카카오맵에서 열기</a></p>';
    m.bindPopup(body + '</div>', { maxWidth: 260 });
    m.on('click', function () {
      var first = days[day].items.findIndex(function (it) { return it.stop === key; });
      selectStop(key, first);
      var el = document.querySelector('.item[data-idx="' + first + '"]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    markers[key] = m;
  });
  allBounds = bounds;
  localBounds = local;
  map.fitBounds(local, { padding: [30, 30] });
}

  var html = '<p class="notice">항목을 누르면 지도가 해당 장소로 이동합니다. 점선 테두리 마커는 좌표를 확정하지 못한 곳입니다.</p><ol class="tl">';
  items.forEach(function (it, i) {
    var s = stops[it.stop], url = kakaoUrl(it.stop);
    html += '<li><button class="item" data-idx="' + i + '" data-stop="' + it.stop + '">';
    html += '<div class="row1"><span class="badge">' + it.visit + '</span><span class="time">' + esc(it.time) + '</span></div>';
    html += '<div class="title">' + (it.icon ? it.icon + ' ' : '') + esc(it.title) + '</div>';
    html += '<div class="chips">';
    if (it.dur) html += '<span class="chip">소요 ' + esc(it.dur) + '</span>';
    if (it.check) html += '<span class="chip warn">전화 확인 필요</span>';
    if (s.approx && !s.noLink) html += '<span class="chip">좌표 추정</span>';
    html += '</div>';
    if (it.memo) html += '<p class="memo">' + esc(it.memo) + '</p>';
    if (it.note) html += '<p class="memo note">⚠ ' + esc(it.note) + '</p>';
    if (url || it.tel) {
      html += '<div class="links">';
      if (url) html += '<a class="kakao ' + (s.approx ? 'approx' : '') + '" href="' + url + '" target="_blank" rel="noopener">카카오맵에서 열기</a>';
      if (it.tel) html += '<a href="tel:' + it.tel.replace(/-/g, '') + '">📞 ' + esc(it.tel) + '</a>';
      html += '</div>';
    }
    html += '</button></li>';
    if (it.next) {
      var walk = it.mode === 'walk';
      html += '<li class="move ' + (walk ? 'walk' : '') + '">' + (walk ? '🚶' : '🚗') + ' 다음 이동 <b>' + esc(it.next) + '</b>' + (it.calc ? ' <span>(경로 계산)</span>' : '') + '</li>';
    }
  });
  box.innerHTML = html + '</ol>';
  box.scrollTop = 0;
  box.querySelectorAll('.item').forEach(function (b) {
    b.addEventListener('click', function () { focusItem(Number(b.dataset.idx)); });
  });
}

/**
 * 일정 항목 클릭 시 지도 이동과 마커 강조
 * @param {number} idx 항목 인덱스
 */
function focusItem(idx) {
  var key = days[currentDay].items[idx].stop, s = stops[key];
  selectStop(key, idx);
  map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration: .8 });
}

/**
 * 일차 전환
 * @param {number} day 일차
 */
function showDay(day) {
  currentDay = day;
  document.querySelectorAll('.tab').forEach(function (t) {
    t.setAttribute('aria-selected', String(Number(t.dataset.day) === day));
  });
  visitInfo = buildVisits(day);
  renderTimeline(day);
  drawMap(day);
  showingAll = false;
  fitControl.btn.textContent = '전체 경로 보기';
  try { history.replaceState(null, '', '#day' + day); } catch (e) { /* file:// 등에서는 무시 */ }
}

/** 헤더 높이를 CSS 변수로 반영(모바일 sticky 지도 위치용) */
function syncHeader() {
  var h = document.getElementById('hdr').offsetHeight;
  document.documentElement.style.setProperty('--hdrH', h + 'px');
  map.invalidateSize();
}

document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () { showDay(Number(t.dataset.day)); });
});
window.addEventListener('resize', syncHeader);
window.addEventListener('hashchange', function () {
  var day = location.hash === '#day2' ? 2 : 1;
  if (day !== currentDay) showDay(day);
});
syncHeader();
showDay(location.hash === '#day2' ? 2 : 1);
setTimeout(syncHeader, 300);
</script>
</body>
</html>
